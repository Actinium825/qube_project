name: qube_project
description: "QUBE Project for AIQUE Exam"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.3

drift_version: &drift_version 2.27.0

dependencies:
  flutter:
    sdk: flutter
  async_redux: ^25.4.0
  cupertino_icons: ^1.0.8
  dartx: ^1.2.0
  drift:
    version: *drift_version
  drift_flutter: ^0.2.4
  email_validator: ^3.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  device_preview_screenshot: ^1.0.0
  drift_dev:
    version: *drift_version
  flutter_gen_runner: ^5.10.0
  flutter_lints: ^6.0.0
  freezed: ^3.0.6

dependency_overrides:
  # device_preview_screenshot override
  freezed_annotation: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
